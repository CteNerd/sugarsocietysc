name: Deploy Backend

on: 
  workflow_call:
    inputs:
      AWS_ECR_REPOSITORY:
        required: true
        type: string
    secrets:
      MONGO_DB_CONNECTION_STRING:
        required: true
      DATABASE_NAME:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      DEFAULT_CONNECTION:
        required: true

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest

    env:
      MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      AWS_REGION: us-east-1
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DEFAULT_CONNECTION: ${{ secrets.DEFAULT_CONNECTION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        run: dotnet restore
        working-directory: ./backend/SugarSociety.Api

      - name: Build backend
        run: dotnet build --configuration Release
        working-directory: ./backend/SugarSociety.Api

      - name: Build backend Docker image
        run: docker build -f ./backend/Dockerfile.prod -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/sugar-society:backend-latest ./backend

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Push backend Docker image to ECR
        run: docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/sugar-society:backend-latest

      - name: Deploy to AWS Fargate
        run: |
          aws ecs update-service --cluster sugar-society --service sugar-society-backend --force-new-deployment
