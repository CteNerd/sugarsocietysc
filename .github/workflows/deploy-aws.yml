name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: aws-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      WEB_DOMAIN_NAME: ${{ vars.WEB_DOMAIN_NAME }}
      STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      NEWSLETTER_FROM_EMAIL: ${{ vars.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_SIGNATURE: ${{ vars.NEWSLETTER_SIGNATURE }}
      RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}

    steps:
      - name: Require main for production
        if: ${{ inputs.environment == 'prod' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deployments must use main."
          exit 1

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synthesize CDK
        run: npx cdk synth -c env="$DEPLOY_ENV"
        working-directory: packages/infra
        env:
          NEWSLETTER_FROM_EMAIL: ${{ vars.NEWSLETTER_FROM_EMAIL }}
          NEWSLETTER_SIGNATURE: ${{ vars.NEWSLETTER_SIGNATURE }}

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AWS_REGION" || -z "$AWS_ACCOUNT_ID" || -z "$AWS_DEPLOY_ROLE_ARN" || -z "$WEB_DOMAIN_NAME" || -z "$STRIPE_PUBLISHABLE_KEY" || -z "$NEWSLETTER_FROM_EMAIL" || -z "$RECAPTCHA_SITE_KEY" ]]; then
            echo "::error::Configure AWS_REGION, AWS_ACCOUNT_ID, AWS_DEPLOY_ROLE_ARN, WEB_DOMAIN_NAME, STRIPE_PUBLISHABLE_KEY, NEWSLETTER_FROM_EMAIL, and RECAPTCHA_SITE_KEY in the selected GitHub Environment."
            exit 1
          fi
          node -e "const c=require('./packages/infra/cdk.json').context.environments[process.env.DEPLOY_ENV]; if (!c || c.account !== process.env.AWS_ACCOUNT_ID || c.region !== process.env.AWS_REGION || c.domainName !== process.env.WEB_DOMAIN_NAME) { console.error('GitHub AWS account, region, or web domain does not match packages/infra/cdk.json'); process.exit(1); }"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated AWS account does not match AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Check NAT-removal runtime prerequisite
        shell: bash
        run: |
          set -euo pipefail
          nat_count="$(node -p "require('./packages/infra/cdk.json').context.environments[process.env.DEPLOY_ENV].natGateways")"
          if [[ "$nat_count" == "0" ]]; then
            functions="$(aws cloudformation list-stack-resources \
              --stack-name "SugarSocietySc-${DEPLOY_ENV}-Api" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
              --output text)"
            if [[ -z "$functions" || "$functions" == "None" ]]; then
              echo "::error::Deploy and verify Data API with NAT retained before removing NAT."
              exit 1
            fi
            for function_name in $functions; do
              aws lambda get-function-configuration \
                --function-name "$function_name" \
                --query '{vpcId:VpcConfig.VpcId,driver:Environment.Variables.DATABASE_DRIVER}' \
                --output json > nat-runtime-readiness.json
              node -e "const c=JSON.parse(require('fs').readFileSync('nat-runtime-readiness.json')); if(c.vpcId || c.driver !== 'data-api') { console.error('Every deployed API Lambda must be non-VPC and use Data API before NAT removal'); process.exit(1); }"
            done
          fi

      - name: Check scheduled-expiry migration prerequisite
        shell: bash
        run: |
          set -euo pipefail
          mode="$(node -p "require('./packages/infra/cdk.json').context.environments[process.env.DEPLOY_ENV].inventoryExpiryMode || 'polling'")"
          if [[ "$mode" == "scheduled" ]]; then
            migrate_arn="$(aws cloudformation describe-stacks \
              --stack-name "SugarSocietySc-${DEPLOY_ENV}-Api" \
              --query "Stacks[0].Outputs[?OutputKey=='MigrateFunctionArn'].OutputValue | [0]" \
              --output text)"
            aws lambda invoke \
              --function-name "$migrate_arn" \
              --cli-binary-format raw-in-base64-out \
              --payload '{"checkInventoryExpiryReady":true}' \
              expiry-readiness.json > expiry-readiness-metadata.json
            node -e "const fs=require('fs'); const meta=JSON.parse(fs.readFileSync('expiry-readiness-metadata.json')); const result=JSON.parse(fs.readFileSync('expiry-readiness.json')); if(meta.StatusCode !== 200 || meta.FunctionError || result.statusCode !== 200 || result.inventoryExpiryReady !== true) { console.error('Deploy in polling mode and apply migrations before enabling scheduled expiry'); process.exit(1); }"
          fi

      - name: Deploy CDK stacks
        run: npx cdk deploy --app cdk.out --all --require-approval never
        working-directory: packages/infra

      - name: Read deployed stack outputs
        shell: bash
        run: |
          set -euo pipefail
          read_output() {
            local value
            if ! value="$(aws cloudformation describe-stacks \
              --stack-name "SugarSocietySc-${DEPLOY_ENV}-$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" \
              --output text)"; then
              echo "::error::Failed to read $2 output in $1 stack." >&2
              return 1
            fi
            if [[ -z "$value" || "$value" == "None" || "$value" == *$'\n'* ]]; then
              echo "::error::Missing or invalid $2 output in $1 stack." >&2
              return 1
            fi
            printf '%s' "$value"
          }
          api_url="$(read_output Api HttpApiUrl)"
          migrate_arn="$(read_output Api MigrateFunctionArn)"
          user_pool="$(read_output Auth UserPoolId)"
          client_id="$(read_output Auth UserPoolClientId)"
          hosted_ui="$(read_output Auth CognitoHostedUiDomain)"
          bucket="$(read_output Web WebBucketName)"
          distribution="$(read_output Web WebDistributionId)"
          {
            echo "API_URL=$api_url"
            echo "MIGRATE_FUNCTION_ARN=$migrate_arn"
            echo "USER_POOL_ID=$user_pool"
            echo "USER_POOL_CLIENT_ID=$client_id"
            echo "COGNITO_HOSTED_UI=$hosted_ui"
            echo "WEB_BUCKET=$bucket"
            echo "WEB_DISTRIBUTION_ID=$distribution"
          } >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_ARN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migration-response.json > invocation-metadata.json
          node -e "const fs=require('fs'); const meta=JSON.parse(fs.readFileSync('invocation-metadata.json')); const result=JSON.parse(fs.readFileSync('migration-response.json')); if(meta.StatusCode !== 200 || meta.FunctionError || result.statusCode !== 200) { console.error('Database migration Lambda did not report success'); process.exit(1); }"

      - name: Smoke-test backend before publishing frontend
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "${API_URL}/health"

      - name: Build production frontend
        run: |
          REACT_APP_API_BASE_URL="$API_URL" \
          REACT_APP_COGNITO_USER_POOL_ID="$USER_POOL_ID" \
          REACT_APP_COGNITO_CLIENT_ID="$USER_POOL_CLIENT_ID" \
          REACT_APP_COGNITO_HOSTED_UI_DOMAIN="$COGNITO_HOSTED_UI" \
          REACT_APP_COGNITO_OAUTH_REDIRECT_URI="https://${WEB_DOMAIN_NAME}/auth/callback" \
          REACT_APP_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
          REACT_APP_RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY" \
          npm run build --workspace=@sugarsocietysc/web
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}

      - name: Publish frontend assets
        run: aws s3 sync packages/web/build "s3://${WEB_BUCKET}" --delete --exclude "uploads/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths '/*'

      - name: Smoke-test API health
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "${API_URL}/health"
