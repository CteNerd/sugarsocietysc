name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: AWS environment to deploy
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      WEB_DOMAIN_NAME: ${{ vars.WEB_DOMAIN_NAME }}
      STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
      NEWSLETTER_FROM_EMAIL: ${{ vars.NEWSLETTER_FROM_EMAIL }}
      NEWSLETTER_SIGNATURE: ${{ vars.NEWSLETTER_SIGNATURE }}
      RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm run test --workspace=@sugarsocietysc/api

      - name: Build workspaces
        run: npm run build

      - name: Synthesize CDK
        run: npx cdk synth -c env="$DEPLOY_ENV"
        working-directory: packages/infra
        env:
          NEWSLETTER_FROM_EMAIL: ${{ vars.NEWSLETTER_FROM_EMAIL }}
          NEWSLETTER_SIGNATURE: ${{ vars.NEWSLETTER_SIGNATURE }}

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AWS_REGION" || -z "$AWS_ACCOUNT_ID" || -z "$AWS_DEPLOY_ROLE_ARN" || -z "$WEB_DOMAIN_NAME" || -z "$STRIPE_PUBLISHABLE_KEY" || -z "$NEWSLETTER_FROM_EMAIL" || -z "$RECAPTCHA_SITE_KEY" ]]; then
            echo "::error::Configure AWS_REGION, AWS_ACCOUNT_ID, AWS_DEPLOY_ROLE_ARN, WEB_DOMAIN_NAME, STRIPE_PUBLISHABLE_KEY, NEWSLETTER_FROM_EMAIL, and RECAPTCHA_SITE_KEY in the selected GitHub Environment."
            exit 1
          fi
          node -e "const c=require('./packages/infra/cdk.json').context.environments[process.env.DEPLOY_ENV]; if (!c || c.account !== process.env.AWS_ACCOUNT_ID || c.region !== process.env.AWS_REGION || c.domainName !== process.env.WEB_DOMAIN_NAME) { console.error('GitHub AWS account, region, or web domain does not match packages/infra/cdk.json'); process.exit(1); }"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated AWS account does not match AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy CDK stacks
        run: npx cdk deploy -c env="$DEPLOY_ENV" --all --require-approval never
        working-directory: packages/infra

      - name: Read deployed stack outputs
        shell: bash
        run: |
          set -euo pipefail
          read_output() {
            aws cloudformation describe-stacks \
              --stack-name "SugarSocietySc-${DEPLOY_ENV}-$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue | [0]" \
              --output text
          }
          echo "API_URL=$(read_output Api HttpApiUrl)" >> "$GITHUB_ENV"
          echo "MIGRATE_FUNCTION_ARN=$(read_output Api MigrateFunctionArn)" >> "$GITHUB_ENV"
          echo "USER_POOL_ID=$(read_output Auth UserPoolId)" >> "$GITHUB_ENV"
          echo "USER_POOL_CLIENT_ID=$(read_output Auth UserPoolClientId)" >> "$GITHUB_ENV"
          echo "COGNITO_HOSTED_UI=$(read_output Auth CognitoHostedUiDomain)" >> "$GITHUB_ENV"
          echo "WEB_BUCKET=$(read_output Web WebBucketName)" >> "$GITHUB_ENV"
          echo "WEB_DISTRIBUTION_ID=$(read_output Web WebDistributionId)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_ARN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migration-response.json > invocation-metadata.json
          if grep -q '"FunctionError"' invocation-metadata.json; then
            cat migration-response.json
            echo "::error::Database migration Lambda reported an error."
            exit 1
          fi

      - name: Build production frontend
        run: |
          REACT_APP_API_BASE_URL="$API_URL" \
          REACT_APP_COGNITO_USER_POOL_ID="$USER_POOL_ID" \
          REACT_APP_COGNITO_CLIENT_ID="$USER_POOL_CLIENT_ID" \
          REACT_APP_COGNITO_HOSTED_UI_DOMAIN="$COGNITO_HOSTED_UI" \
          REACT_APP_COGNITO_OAUTH_REDIRECT_URI="https://${WEB_DOMAIN_NAME}/auth/callback" \
          REACT_APP_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
          REACT_APP_RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY" \
          npm run build --workspace=@sugarsocietysc/web
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}

      - name: Publish frontend assets
        run: aws s3 sync packages/web/build "s3://${WEB_BUCKET}" --delete --exclude "uploads/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" --paths '/*'

      - name: Smoke-test API health
        run: curl --fail --silent --show-error "${API_URL}/health"
