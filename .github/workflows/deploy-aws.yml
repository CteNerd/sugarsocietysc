name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Dev previews only; prod on main first deploys and verifies dev
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

# Hold shared staging through its tests and any production approval/promotion.
concurrency:
  group: aws-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SOURCE_REF: ${{ github.ref }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - name: Reject production requests from non-main refs
        run: |
          if [[ "$TARGET_ENV" == "prod" && "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::Non-main branches may deploy dev previews only."
            exit 1
          fi

  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml

  staging:
    needs: validate
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  production:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.environment == 'prod') }}
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
