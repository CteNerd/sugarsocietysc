name: Infra CI

on:
  pull_request:
    paths:
      - 'packages/infra/**'
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/infra-ci.yml'
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: CDK synth (dev) — template generation only, no AWS credentials used
        run: npm run synth:dev --workspace=@sugarsocietysc/infra

      - name: CDK synth (prod)
        run: npm run synth:prod --workspace=@sugarsocietysc/infra

      - name: Validate lean infrastructure safeguards
        run: npm run validate:lean --workspace=@sugarsocietysc/infra
