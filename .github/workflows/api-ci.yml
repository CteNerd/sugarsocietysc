name: API CI

on:
  pull_request:
    paths:
      - 'packages/api/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint --workspace=@sugarsocietysc/api

      - name: Test
        run: npm run test --workspace=@sugarsocietysc/api

      - name: Test PostgreSQL transport and migrations
        run: npm run test:integration --workspace=@sugarsocietysc/api
