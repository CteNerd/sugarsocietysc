name: Deploy Frontend

on: 
  workflow_call:
    inputs:
      AWS_ECR_REPOSITORY:
        required: true
        type: string
    secrets:
      MONGO_DB_CONNECTION_STRING:
        required: true
      DATABASE_NAME:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    env:
      MONGO_DB_CONNECTION_STRING: ${{ secrets.MONGO_DB_CONNECTION_STRING }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      AWS_REGION: us-east-1
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for frontend changes
      id: check_changes
      run: |
        if git diff --quiet HEAD^ HEAD ./frontend; then
          echo "No changes in frontend. Skipping build and deploy."
          exit 0
        fi

    - name: Configure AWS Credentials
      if: steps.check_changes.outputs.changes == 'true'
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Node.js
      if: steps.check_changes.outputs.changes == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'

    - name: Install frontend dependencies
      if: steps.check_changes.outputs.changes == 'true'
      run: npm install
      working-directory: ./frontend

    - name: Build frontend
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        CI=false npm run build
      working-directory: ./frontend

    - name: Build frontend Docker image
      if: steps.check_changes.outputs.changes == 'true'
      run: docker build -f ./frontend/Dockerfile.prod -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/sugar-society:frontend-latest ./frontend

    - name: Log in to Amazon ECR
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    - name: Push frontend Docker image to ECR
      if: steps.check_changes.outputs.changes == 'true'
      run: docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/sugar-society:frontend-latest

    - name: Deploy to AWS Fargate
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        aws ecs update-service --cluster sugar-society --service sugar-society-frontend --force-new-deployment

    - name: Configure Route 53
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        # Add your Route 53 configuration commands here
        echo "Configuring Route 53..."
